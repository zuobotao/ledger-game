<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0065fd"/>
      <stop offset="100%" stop-color="#0043ad"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="8" y="8" width="184" height="184" rx="42" ry="42" fill="url(#bg)"/>
  <!-- Ledger book / financial chart abstract mark -->
  <g transform="translate(50, 42)">
    <!-- Left bar (low) -->
    <rect x="0" y="72" width="22" height="44" rx="6" fill="#ffffff" opacity="0.85"/>
    <!-- Middle bar (medium) -->
    <rect x="36" y="48" width="22" height="68" rx="6" fill="#ffffff" opacity="0.95"/>
    <!-- Right bar (high + accent cap) -->
    <rect x="72" y="20" width="22" height="96" rx="6" fill="url(#accent)"/>
    <!-- Book spine line -->
    <line x1="110" y1="0" x2="110" y2="116" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <!-- Book pages arc -->
    <path d="M 110 4 Q 128 12 134 30 L 134 108 Q 128 124 110 130" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.25"/>
  </g>
  <!-- Ledger text -->
  <text x="100" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="1">Ledger</text>
</svg>
