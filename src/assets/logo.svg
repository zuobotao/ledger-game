<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Ledger Logo: Stylized "L" with ledger book / financial chart concept -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0065fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0043ad;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#30d158;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#34c759;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="40" ry="40" fill="url(#bgGrad)" />

  <!-- Ledger book spine (vertical line) -->
  <rect x="60" y="45" width="5" height="110" rx="2" fill="rgba(255,255,255,0.15)" />

  <!-- Financial bar chart / growth bars -->
  <rect x="78" y="120" width="14" height="35" rx="3" fill="rgba(255,255,255,0.6)" />
  <rect x="100" y="95" width="14" height="60" rx="3" fill="rgba(255,255,255,0.75)" />
  <rect x="122" y="70" width="14" height="85" rx="3" fill="url(#accentGrad)" />

  <!-- Base line -->
  <rect x="72" y="158" width="76" height="3" rx="1.5" fill="rgba(255,255,255,0.2)" />
</svg>
