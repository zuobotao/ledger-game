    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }

        mask-position: center;
        background-color: currentColor;
      }

      /* 庆祝光晕背景 */
      .victory-bg {
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(251, 191, 36, 0.15), transparent),
          radial-gradient(ellipse 60% 40% at 50% 120%, rgba(249, 115, 22, 0.12), transparent),
          var(--doubao-background);
      }

      /* 渐变文字 - 金色到橙色 */
      .gradient-gold-text {
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 40%, #f97316 70%, #ea580c 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* 玻璃拟态卡片 */
      .glass-card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      /* 奖杯光晕效果 */
      .trophy-glow {
        filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.4))
                drop-shadow(0 0 80px rgba(249, 115, 22, 0.2));
      }

      /* 徽章浮动动画 */
      @keyframes badge-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      .badge-float {
        animation: badge-float 3s ease-in-out infinite;
      }
      .badge-float:nth-child(2) {
        animation-delay: 0.5s;
      }
      .badge-float:nth-child(3) {
        animation-delay: 1s;
      }

      /* 按钮悬浮动效 - 使用豆包主色 */
      .btn-primary-victory {
        background: var(--doubao-primary);
        color: var(--doubao-primary-foreground);
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(0, 101, 253, 0.3);
      }
      .btn-primary-victory:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0, 101, 253, 0.45);
        filter: brightness(1.1);
      }
      .btn-primary-victory:active {
        transform: translateY(0);
      }

      .btn-secondary-victory {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--doubao-foreground);
        transition: all 0.3s ease;
      }
      .btn-secondary-victory:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
