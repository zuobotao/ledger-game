    <main class="min-h-screen flex flex-col">
      <style>
        .ft-topbar { display:flex; align-items:center; justify-content:space-between; padding:calc(var(--spacing)*5) calc(var(--spacing)*6); border-bottom:1px solid var(--doubao-border); }
        .ft-title { font-size:22px; font-weight:700; letter-spacing:-0.02em; color:var(--doubao-foreground); }
        .ft-badge { display:inline-flex; align-items:center; gap:calc(var(--spacing)*2); padding:calc(var(--spacing)*2) calc(var(--spacing)*4); border-radius:999px; background:var(--doubao-secondary); color:var(--doubao-secondary-foreground); font-size:13px; font-weight:600; }
        .ft-back { display:inline-flex; align-items:center; gap:calc(var(--spacing)*2); color:var(--doubao-primary); font-size:14px; font-weight:600; text-decoration:none; }
        .ft-back:hover { text-decoration:underline; }
        .ft-board { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--spacing)*8); padding:calc(var(--spacing)*6); }
        .ft-track { display:flex; align-items:flex-end; gap:calc(var(--spacing)*2); width:100%; max-width:960px; overflow-x:auto; padding-bottom:calc(var(--spacing)*4); }
        .ft-space { position:relative; flex:0 0 auto; width:96px; height:112px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:calc(var(--spacing)*2); border-radius:var(--radius); border:1px solid var(--doubao-border); background:var(--doubao-background); color:var(--doubao-foreground); box-shadow:var(--shadow-sm); }

        .ft-space.cashflow { background:var(--doubao-success); color:var(--doubao-background); border-color:transparent; }
        .ft-space.doodad { background:var(--doubao-destructive); color:var(--doubao-background); border-color:transparent; }
        .ft-space.opportunity { background:var(--doubao-primary); color:var(--doubao-primary-foreground); border-color:transparent; }
